[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "twstock-etl"
version = "0.1.0"
description = "TwStock ETL worker"
requires-python = ">=3.11"
dependencies = [
  "twstock-db",
  "httpx==0.28.1",
  "beautifulsoup4==4.13.5",
  "apscheduler==3.11.0",
  "tzdata==2025.2",
]

[tool.setuptools.packages.find]
include = ["twstock_etl*"]
